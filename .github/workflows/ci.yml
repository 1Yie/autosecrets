name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: autosecrets
          POSTGRES_USER: autosecrets
          POSTGRES_PASSWORD: test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U autosecrets"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://autosecrets:test@localhost:55433/autosecrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare Agent venv (interop tests)
        run: |
          python3 -m venv agent/.venv
          agent/.venv/bin/pip install --quiet -e "agent[dev]"
      - name: Format check
        working-directory: core
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Go tests and coverage gate
        working-directory: core
        run: |
          go test ./... -count=1 -coverprofile=coverage.out
          python3 ../scripts/coverage_gate.py coverage.out 70

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start shared test PostgreSQL
        run: |
          docker run -d --name autosecrets-test-pg \
            -e POSTGRES_DB=autosecrets -e POSTGRES_USER=autosecrets \
            -e POSTGRES_PASSWORD=test -p 55433:5432 postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec autosecrets-test-pg \
              pg_isready -U autosecrets >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec autosecrets-test-pg \
            pg_isready -U autosecrets >/dev/null
      - name: Install Agent package
        run: python -m pip install --quiet -e "agent[dev]"
      - name: Lint
        working-directory: agent
        run: ruff check src tests
      - name: Python tests
        working-directory: agent
        run: python -m pytest tests/ -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Go vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: core/go.mod
          go-package: ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: bun run lint
      - name: Lint OpenAPI contract
        working-directory: web
        run: bun run lint:api
      - name: API types freshness
        working-directory: web
        run: |
          bun run gen:api
          git diff --exit-code -- src/lib/api/generated.ts
      - name: Unit tests
        working-directory: web
        run: bun run test
      - name: Typecheck and build
        working-directory: web
        run: bun run build
