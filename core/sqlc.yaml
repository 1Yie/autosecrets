version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/database/queries"
    gen:
      go:
        package: "gen"
        out: "internal/database/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
