server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;
	client_max_body_size 16m;

	# Same-origin entry: console, management API, and Agent API share
	# one published port. Core stays on the compose network.
	location ~ ^/(api|agent)/ {
		resolver 127.0.0.11 valid=10s ipv6=off;
		set $core http://core:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
		# Serial header is only valid from an mTLS proxy talking to Core
		# directly. Strip it here so a public client cannot spoof a node.
		proxy_set_header X-Autosecrets-Client-Cert "";
		proxy_pass $core;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
