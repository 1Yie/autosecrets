# Front Core with the host nginx. Do not start the bundled Caddy.
#
#   docker compose -f compose.yaml -f compose.nginx.yaml up -d --build
services:
  core:
    ports:
      - "127.0.0.1:${CORE_HOST_PORT:-18080}:8080"

  web:
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-18081}:80"

  caddy:
    profiles: ["caddy"]
