# Local stack. One published address: http://127.0.0.1:18008
# Console, /api/v1, and /agent/v1 share that port. Core stays internal.
# The Agent container starts and waits for enrollment (AGENT_ENROLL_TOKEN).
# Postgres is on 55434 for host-side inspection only.
name: autosecrets-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: autosecrets
      POSTGRES_USER: autosecrets
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosecrets -d autosecrets"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ../core
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      CORE_LISTEN_ADDR: ":8080"
      CORE_TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      CORE_PROXY_CERT_HEADER: X-Autosecrets-Client-Cert
      CORE_KEYS_DIR: /keys
      CORE_DB_DSN: >-
        host=postgres port=5432 dbname=autosecrets
        user=autosecrets password=test sslmode=disable
      CORE_PUBLIC_URL: ${CORE_PUBLIC_URL:-http://127.0.0.1:18008}
      CORE_PUBLIC_AGENT_URL: >-
        ${CORE_PUBLIC_AGENT_URL:-http://127.0.0.1:18008}
      CORE_ARTIFACT_DIR: /artifacts
    volumes:
      - keys_dev:/keys
      - artifacts_dev:/artifacts
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  artifacts:
    build:
      context: ../agent
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/build-artifacts", "watch"]
    depends_on:
      core:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SIGNING_KEY: /keys/core-signing.key
      ARTIFACT_DIR: /artifacts
      TARGETS: all
      AGENT_SRC: /app
    volumes:
      - keys_dev:/keys:ro
      - artifacts_dev:/artifacts

  web:
    build:
      context: ../web
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${AUTOSECRETS_PORT:-18008}:80"
    environment:
      TZ: Asia/Shanghai

  agent-proxy:
    build:
      context: ../agent
    restart: unless-stopped
    entrypoint: ["python", "/opt/devproxy.py"]
    depends_on:
      core:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      CORE_UPSTREAM: core:8080
      AGENT_PROXY_HOSTNAME: agent-proxy
      AGENT_PROXY_SAN_IPS: ${AGENT_PROXY_SAN_IPS:-}
    volumes:
      - keys_dev:/keys:ro

  agent:
    build:
      context: ../agent
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
      agent-proxy:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      AGENT_SERVER_URL: https://agent-proxy:18443
      AGENT_NAME: ${AGENT_NAME:-compose-dev}
      AGENT_ENROLL_TOKEN: ${AGENT_ENROLL_TOKEN:-}
    volumes:
      - keys_dev:/keys:ro
      - agent_identity:/var/lib/autosecrets-agent

volumes:
  postgres_dev_data:
  keys_dev:
  artifacts_dev:
  agent_identity:
