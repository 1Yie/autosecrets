# Drop into /etc/nginx/sites-available/ and enable.
# Replace the two server_name values and the certificate paths.

upstream autosecrets_core {
	server 127.0.0.1:18080;
	keepalive 16;
}

upstream autosecrets_web {
	server 127.0.0.1:18081;
	keepalive 16;
}

# Management console + /api/v1 (browser sessions).
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name secrets.example.com;

	ssl_certificate     /etc/nginx/certs/secrets.example.com.fullchain.pem;
	ssl_certificate_key /etc/nginx/certs/secrets.example.com.key;

	client_max_body_size 8m;

	location /api/ {
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection        "";
		proxy_pass http://autosecrets_core;
	}

	location / {
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection        "";
		proxy_pass http://autosecrets_web;
	}
}

# Agent API. enroll / install.sh / artifacts stay public;
# every other path requires a client cert from the internal CA.
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name agents.example.com;

	ssl_certificate     /etc/nginx/certs/agents.example.com.fullchain.pem;
	ssl_certificate_key /etc/nginx/certs/agents.example.com.key;

	ssl_client_certificate /etc/nginx/certs/autosecrets-agent-ca.crt;
	ssl_verify_client optional;
	ssl_verify_depth 2;

	client_max_body_size 16m;

	location = /agent/v1/enroll {
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection        "";
		proxy_pass http://autosecrets_core;
	}

	location = /agent/v1/install.sh {
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection        "";
		proxy_pass http://autosecrets_core;
	}

	location /agent/v1/artifacts/ {
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection        "";
		proxy_pass http://autosecrets_core;
	}

	location / {
		if ($ssl_client_verify != SUCCESS) {
			return 403;
		}
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# Core stores lowercase hex with no colons (big.Int.Text(16)).
		# If sync returns 403, lowercase / strip colons before forwarding.
		proxy_set_header X-Autosecrets-Client-Cert $ssl_client_serial;
		proxy_set_header Connection        "";
		proxy_pass http://autosecrets_core;
	}
}
