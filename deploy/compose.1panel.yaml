# Put Core and Web on 1Panel's OpenResty network so the panel
# can reverse-proxy container names instead of 127.0.0.1.
#
#   docker network ls | grep -i 1panel
#   docker compose -f compose.yaml -f compose.1panel.yaml up -d
#
# 1Panel site (reverse proxy):
#   /     -> http://autosecrets-web-1:80
#   /api/ -> http://autosecrets-core-1:8080
# Agent site:
#   /     -> http://autosecrets-core-1:8080
services:
  core:
    networks: [default, proxy]

  web:
    networks: [default, proxy]

networks:
  proxy:
    external: true
    name: ${AUTSECRETS_PROXY_NETWORK:-1panel-network}
