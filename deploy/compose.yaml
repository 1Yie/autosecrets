name: autosecrets

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autosecrets
      POSTGRES_USER: autosecrets
      POSTGRES_PASSWORD: ${AUTOSECRETS_DB_PASSWORD:?set AUTOSECRETS_DB_PASSWORD in the environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosecrets -d autosecrets"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build: ../core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CORE_LISTEN_ADDR: ":8080"
      CORE_TRUSTED_PROXY_CIDRS: ${CORE_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      CORE_PROXY_CERT_HEADER: "X-Autosecrets-Client-Cert"
      CORE_KEYS_DIR: "/keys"
      CORE_DB_DSN: "postgres://autosecrets:${AUTOSECRETS_DB_PASSWORD:?set AUTOSECRETS_DB_PASSWORD in the environment}@postgres:5432/autosecrets"
      CORE_PUBLIC_AGENT_URL: ${CORE_PUBLIC_AGENT_URL:-}
      CORE_ARTIFACT_DIR: ${CORE_ARTIFACT_DIR:-/artifacts}
    volumes:
      - keys:/keys
      - ${CORE_ARTIFACT_DIR:-./artifacts}:/artifacts:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./certs/agent-ca.pem:/certs/agent-ca.pem:ro

volumes:
  postgres_data:
  keys:
  caddy_data:
  caddy_config:
