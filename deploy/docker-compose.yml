name: autosecrets

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: autosecrets
      POSTGRES_USER: autosecrets
      # Applied only on first volume init. Changing this later does not
      # update an existing role password.
      POSTGRES_PASSWORD: ${AUTOSECRETS_DB_PASSWORD:?set AUTOSECRETS_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosecrets -d autosecrets"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ../core
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      CORE_LISTEN_ADDR: ":8080"
      CORE_TRUSTED_PROXY_CIDRS: ${CORE_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      CORE_PROXY_CERT_HEADER: "X-Autosecrets-Client-Cert"
      CORE_KEYS_DIR: "/keys"
      CORE_DB_DSN: >-
        host=postgres port=5432 dbname=autosecrets
        user=autosecrets sslmode=disable
        password='${AUTOSECRETS_DB_PASSWORD}'
      CORE_PUBLIC_URL: >-
        ${CORE_PUBLIC_URL:-${AUTOSECRETS_PUBLIC_URL:-}}
      CORE_PUBLIC_AGENT_URL: >-
        ${CORE_PUBLIC_AGENT_URL:-${AUTOSECRETS_PUBLIC_URL:-}}
      CORE_CORS_ORIGINS: ${CORE_CORS_ORIGINS:-}
      CORE_OIDC_ISSUER_URL: ${CORE_OIDC_ISSUER_URL:-}
      CORE_OIDC_CLIENT_ID: ${CORE_OIDC_CLIENT_ID:-}
      CORE_OIDC_CLIENT_SECRET: ${CORE_OIDC_CLIENT_SECRET:-}
      CORE_OIDC_SCOPES: ${CORE_OIDC_SCOPES:-openid profile}
      CORE_OAUTH_AUTHORIZATION_URL: ${CORE_OAUTH_AUTHORIZATION_URL:-}
      CORE_OAUTH_TOKEN_URL: ${CORE_OAUTH_TOKEN_URL:-}
      CORE_OAUTH_USERINFO_URL: ${CORE_OAUTH_USERINFO_URL:-}
      CORE_OAUTH_CLIENT_ID: ${CORE_OAUTH_CLIENT_ID:-}
      CORE_OAUTH_CLIENT_SECRET: ${CORE_OAUTH_CLIENT_SECRET:-}
      CORE_OAUTH_SCOPES: ${CORE_OAUTH_SCOPES:-profile}
      CORE_ARTIFACT_DIR: /artifacts
    volumes:
      - keys:/keys
      - ${AUTOSECRETS_ARTIFACT_DIR:-artifacts}:/artifacts:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  artifacts:
    build:
      context: ../agent
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/build-artifacts", "watch"]
    depends_on:
      core:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SIGNING_KEY: /keys/core-signing.key
      ARTIFACT_DIR: /artifacts
      TARGETS: all
      AGENT_SRC: /app
    volumes:
      - keys:/keys:ro
      - ${AUTOSECRETS_ARTIFACT_DIR:-artifacts}:/artifacts

  web:
    build:
      context: ../web
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${AUTOSECRETS_PORT:-18008}:80"
    environment:
      TZ: Asia/Shanghai

volumes:
  postgres_data:
  keys:
  artifacts:
